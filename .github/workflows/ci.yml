name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python -m compileall -q main.py modules/

      - name: Install ruff
        run: pip install ruff

      # E9/F: syntax errors and definite bugs (undefined names, unused
      # imports). Style rules are deliberately excluded.
      - name: Lint
        run: ruff check --select E9,F .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # The text-layer engine and the EPUB writer need neither torch nor marker.
      # pdftext imports numpy without declaring it, so it is listed here.
      - name: Install test dependencies
        run: pip install "pdftext==0.6.3" numpy "markdown==3.10.2" "latex2mathml==3.81.0" "Pillow<11" regex pytest

      - name: Download EPUBCheck
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q epubcheck.zip
          echo "EPUBCHECK_JAR=$PWD/epubcheck-5.1.0/epubcheck.jar" >> "$GITHUB_ENV"

      - name: Run tests
        run: python -m pytest -q
